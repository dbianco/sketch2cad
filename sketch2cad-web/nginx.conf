# Main nginx configuration for the sketch2cad-web image.
# Replaces /etc/nginx/nginx.conf so the server can run as the unprivileged
# `nginx` user: the pid file and temporary paths live under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable; everything else served by the SPA
    # (index.html, including the fallback) must be revalidated. API responses
    # keep whatever Cache-Control the API sets (empty value = header omitted).
    map $uri $static_cache_control {
        ~^/api/          "";
        ~^/assets/       "public, max-age=31536000, immutable";
        default          "no-cache";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Docker's embedded DNS; lets nginx start even when the `api` host
        # does not exist (requests to /api/ then fail with 502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control $static_cache_control;

        location /api/ {
            # Upload limit from V-02 (50 MB).
            client_max_body_size 50m;

            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
