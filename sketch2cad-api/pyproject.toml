[project]
name = "sketch2cad"
version = "0.1.0"
description = "Sketch2CAD API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1",
    "procrastinate>=2.15",
    "uvicorn>=0.32",
    "ezdxf==1.4.5",
    "rfc8785>=0.1.4",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "pypdfium2>=5.14.0",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.4",
    "reportlab==5.1.0",
    "cryptography>=46",
    "scikit-image>=0.26.0",
    "shapely>=2.2.0",
]

[project.optional-dependencies]
# OCR of user crops (task 001-105): installed only in the worker image (Dockerfile.worker)
# and for the slow OCR tests (`uv sync --extra ocr`); the API and the default test
# environment never import torch or transformers.
ocr = [
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx2>=2.16.0",
    "pip-licenses>=5.5.5",
    "pip-audit>=2.7",
    "hypothesis>=6.170.9",
]

[tool.uv.sources]
# CPU-only torch wheels on Linux (the default PyPI wheels pull the CUDA stack); macOS and
# Windows wheels from PyPI are CPU builds already.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sketch2cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# ca01..ca13 label the tests that realize each acceptance criterion of spec section 16. They
# are applied from the CA_TESTS mapping in tests/conftest.py; scripts/ca_report.py reports them.
markers = [
    "perf: real-timing performance measurements",
    "slow: needs the `ocr` extra and the TrOCR model; skipped when they are missing",
    "ca01: CA-01 Original: the original is preserved and its SHA-256 verified afterwards",
    "ca02: CA-02 Calibration: an oblique photo of a known pattern is rectified within 1 mm; unrectified it cannot be metric",
    "ca03: CA-03 Reconstruction from dimensions: triangulation and baseline+offset match the expected coordinates within 1 cm",
    "ca04: CA-04 Suggestions (H5): on the synthetic set >= 90 % of segments > 20 mm recovered with deviation < 2 mm; zero spurious < 5 mm",
    "ca05: CA-05 Human review (H5): a suggestion can be accepted, corrected, rejected or replaced; provenance and history are kept",
    "ca06: CA-06 DXF: passes audit(), re-reads equal to the snapshot (golden + re-read)",
    "ca07: CA-07 Scale: three control distances agree in model, DXF and PDF within 0.5 %",
    "ca08: CA-08 Reproducibility: two exports of the same revision give DXF and PDF with the same hash",
    "ca09: CA-09 Audit: one altered byte of an artifact or event fails verification naming the artifact",
    "ca10: CA-10 States: forbidden transitions are rejected; VALIDATED freezes; reopening creates a new revision and keeps the old one",
    "ca11: CA-11 Failures: unreadable image, calibration out of tolerance, failed job -> explicit state with cause and action",
    "ca12: CA-12 Security: an unauthorized user cannot read, edit, export or download; every attempt is recorded",
    "ca13: CA-13 Licenses: no dependency outside the allow-list",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests", "verifier"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
