# gitleaks configuration for the Sketch2CAD repository (jotdown H0-9).
#
# All default gitleaks rules apply and nothing is allow-listed except one path:
# tests/fixtures/ of the API holds a deliberately fake private key (fake_secret.txt)
# that proves the private-key rule fires.
#
# The exclusion is anchored to the path as gitleaks reports it in git mode, which is
# relative to the repository root ("sketch2cad-api/tests/fixtures/..."). Therefore:
#   gitleaks detect --source . --config .gitleaks.toml                     -> fixture excluded
#   gitleaks detect --no-git --source tests/fixtures --config .gitleaks.toml -> fixture reported
# (in --no-git mode the path is "tests/fixtures/...", which the anchor does not match).
# Do not add other entries without a reviewed justification.

title = "sketch2cad"

[extend]
useDefault = true

[allowlist]
description = "Deliberately fake secrets used to test the scanner"
paths = ['''^sketch2cad-api/tests/fixtures/''']
