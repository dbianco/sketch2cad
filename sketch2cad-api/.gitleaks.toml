# gitleaks configuration for the Sketch2CAD repository (jotdown H0-9).
#
# All default gitleaks rules apply and nothing is allow-listed except fixture paths:
# tests/fixtures/ of the API holds a deliberately fake private key (fake_secret.txt)
# that proves the private-key rule fires. The web fixture folder is listed too because a
# git-mode scan covers the whole repository; keep in sync with sketch2cad-web/.gitleaks.toml.
#
# The exclusion is anchored to the path as gitleaks reports it in git mode, which is
# relative to the repository root ("sketch2cad-api/tests/fixtures/..."). Therefore:
#   gitleaks detect --source . --config .gitleaks.toml                     -> fixture excluded
#   gitleaks detect --no-git --source tests/fixtures --config .gitleaks.toml -> fixture reported
# (in --no-git mode the path is "tests/fixtures/...", which the anchor does not match).
# One more exclusion (2026-10-26): the generic-api-key rule flags the type annotations
# `signing_key: Ed25519PrivateKey` / `key: Ed25519PrivateKey` (package/build.py and
# tests/package/test_verifier.py) as secrets. They are code, not keys; the regex below matches
# only whole lines of that exact shape.
# Do not add other entries without a reviewed justification.

title = "sketch2cad"

[extend]
useDefault = true

[allowlist]
description = "Deliberately fake secrets used to test the scanner"
paths = ['''^sketch2cad-api/tests/fixtures/''', '''^sketch2cad-web/tests/fixtures/''']
regexTarget = "line"
regexes = ['''^\s*(signing_)?key: Ed25519PrivateKey\s*$''']
