# Playwright E2E against the full compose stack (jotdown H0-12, decision D-9): login and case
# creation through the web service, which proxies to the api of the same commit. The stack is
# started and removed by sketch2cad-web/scripts/e2e-stack.sh from the Playwright global setup
# and teardown; the tests never target a static preview server.
#
# Action pinning follows web-ci.yml: every action is pinned to a full commit SHA that was resolved
# through the GitHub API (major tags dereferenced to their commit). Tool versions match
# sketch2cad-web/Dockerfile.
name: e2e

on:
  pull_request:
    paths: ["sketch2cad-web/**", "sketch2cad-api/**", ".github/workflows/e2e.yml"]
  push:
    branches: [main]
    paths: ["sketch2cad-web/**", "sketch2cad-api/**", ".github/workflows/e2e.yml"]
  # Manual run, optionally with the OCR worker (see E2E_WITH_OCR below).
  workflow_dispatch:
    inputs:
      with_ocr:
        description: "Build the worker with torch and the TrOCR model and run the OCR E2E tests (~4.3 GB image, ~10 extra minutes)"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sketch2cad-web

env:
  NODE_VERSION: "24.22.1"
  PNPM_VERSION: "11.20.0"
  # Same uv as api-ci.yml: e2e/export_verify.spec.ts runs the package verifier through
  # scripts/verify_downloaded_zip.sh (`uv run --frozen --project ../sketch2cad-api`).
  UV_VERSION: "0.12.5"
  # Pull requests and pushes build the worker without torch and the TrOCR model
  # (scripts/e2e-stack.sh sets WORKER_WITH_OCR=false unless E2E_WITH_OCR=1): the OCR reading
  # tests of e2e/suggestions_ocr.spec.ts are skipped and the spec checks the failed OCR job
  # instead. The OCR worker image is ~4.3 GB with a ~8.5 min cold build, so it only runs on a
  # manual `workflow_dispatch` with `with_ocr: true`.
  E2E_WITH_OCR: ${{ inputs.with_ocr && '1' || '0' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.with_ocr && 40 || 20 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          package_json_file: sketch2cad-web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: sketch2cad-web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p e2e
      - run: pnpm exec playwright install --with-deps chromium
      # global-setup.ts runs scripts/e2e-stack.sh up (compose build, signing key, up --wait plus
      # the technician and reviewer users); global-teardown.ts runs scripts/e2e-stack.sh down.
      - run: pnpm exec playwright test
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: sketch2cad-web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the Playwright traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: sketch2cad-web/test-results/
          retention-days: 14
          if-no-files-found: ignore
      # Safety net when the run is cancelled before the global teardown.
      - name: Remove the compose stack
        if: always()
        run: bash scripts/e2e-stack.sh down
