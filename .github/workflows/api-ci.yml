# CI for the API (sketch2cad-api/). Jotdown H0-6 (duration, report only), H0-7 (licenses),
# H0-8 (pip-audit) and H0-9 (gitleaks).
#
# Action pinning: actions/checkout is pinned to the full commit SHA of v4.2.2.
# astral-sh/setup-uv uses the major tag v6 because its commit SHA could not be verified
# when this file was written; replace it with the SHA of the release you audit.
# gitleaks runs as a Docker image pinned by tag and digest.
name: api-ci

on:
  pull_request:
    paths: ["sketch2cad-api/**", ".github/workflows/api-ci.yml"]
  push:
    branches: [main]
    paths: ["sketch2cad-api/**", ".github/workflows/api-ci.yml"]

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sketch2cad-api

env:
  UV_VERSION: "0.12.5"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

jobs:
  start:
    runs-on: ubuntu-latest
    outputs:
      epoch: ${{ steps.clock.outputs.epoch }}
    steps:
      - id: clock
        working-directory: .
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v6 # major tag: SHA not verified, see header
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sketch2cad
          POSTGRES_PASSWORD: sketch2cad
          POSTGRES_DB: sketch2cad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sketch2cad -d sketch2cad_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sketch2cad:sketch2cad@localhost:5432/sketch2cad_test
    outputs:
      login_p95_ms: ${{ steps.pytest.outputs.login_p95_ms }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v6 # major tag: SHA not verified, see header
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - id: pytest
        run: |
          status=0
          uv run pytest -q || status=$?
          # The login perf test appends login_p95_ms=<value> to this step's summary when CI=true.
          p95="$(grep -o 'login_p95_ms=[0-9.]*' "$GITHUB_STEP_SUMMARY" | tail -n 1 | cut -d= -f2 || true)"
          echo "login_p95_ms=${p95}" >> "$GITHUB_OUTPUT"
          exit "$status"

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sketch2cad
          POSTGRES_PASSWORD: sketch2cad
          POSTGRES_DB: sketch2cad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sketch2cad -d sketch2cad_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sketch2cad:sketch2cad@localhost:5432/sketch2cad_test
      MIGRATION_ROUNDTRIP_SCHEMA: public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v6 # major tag: SHA not verified, see header
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: bash scripts/migration_roundtrip.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v6 # major tag: SHA not verified, see header
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run python scripts/check_licenses.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v6 # major tag: SHA not verified, see header
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      # pip-audit exits 1 when it finds vulnerabilities; the verdict belongs to check_audit.py,
      # which also fails when pip-audit produced no valid JSON (for example after a crash).
      - run: |
          set +o pipefail
          uv run pip-audit --format json --progress-spinner off | uv run python scripts/check_audit.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fake key fixture is detected (self-test of the private-key rule)
        run: |
          status=0
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo/sketch2cad-api "$GITLEAKS_IMAGE" \
            detect --no-git --source tests/fixtures --config .gitleaks.toml --redact || status=$?
          if [ "$status" -ne 1 ]; then
            echo "gitleaks did not report the fake key in tests/fixtures (exit ${status})" >&2
            exit 1
          fi
      - name: Repository history has no secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo/sketch2cad-api "$GITLEAKS_IMAGE" \
            detect --source . --config .gitleaks.toml --redact

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/compose_smoke.sh

  summary:
    needs: [start, lint, test, migrations, licenses, audit, secrets, compose-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Report only (H0-6): the reference is 10 minutes and exceeding it never fails the run.
      # The duration is measured from the start job, so it excludes the initial queue time.
      - working-directory: .
        env:
          START_EPOCH: ${{ needs.start.outputs.epoch }}
          LOGIN_P95_MS: ${{ needs.test.outputs.login_p95_ms }}
          RESULTS: >-
            lint=${{ needs.lint.result }}
            test=${{ needs.test.result }}
            migrations=${{ needs.migrations.result }}
            licenses=${{ needs.licenses.result }}
            audit=${{ needs.audit.result }}
            secrets=${{ needs.secrets.result }}
            compose-smoke=${{ needs.compose-smoke.result }}
        run: |
          now="$(date +%s)"
          start="${START_EPOCH:-$now}"
          minutes="$(awk -v s="$start" -v n="$now" 'BEGIN { printf "%.1f", (n - s) / 60 }')"
          {
            echo "## api-ci"
            echo
            echo '```'
            echo "ci_duration_minutes=${minutes}"
            if [ -n "$LOGIN_P95_MS" ]; then
              echo "login_p95_ms=${LOGIN_P95_MS}"
            fi
            for result in $RESULTS; do
              echo "job_${result}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
