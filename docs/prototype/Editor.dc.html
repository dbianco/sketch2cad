<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor 2D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
</helmet>
<div style="width:1200px;height:720px;box-sizing:border-box;background:#F4F6F8;color:#14202B;display:flex;flex-direction:column">
  <div style="height:48px;background:#14202B;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px">
    <div style="display:flex;gap:16px;align-items:center"><b style="font-size:16px">Sketch2CAD</b><span style="color:#C9D3DC">EXP-2026-0003 · Plano 1 · Borrador</span></div>
    <div style="display:flex;gap:12px;align-items:center">
      <span style="padding:3px 10px;border-radius:12px;background:#FDEBC8;color:#7A3E00;font-size:13px">Estado métrico: aproximado</span>
      <button style="height:32px;padding:0 12px;background:#0B6E8A;color:#fff;border:0;border-radius:6px;font-size:13px">Enviar a revisión</button>
    </div>
  </div>
  <div style="display:flex;flex-grow:1;min-height:0">
    <div style="width:72px;background:#fff;border-right:1px solid #D5DCE3;display:flex;flex-direction:column;gap:6px;padding:8px;font-size:11px;text-align:center">
      <button aria-label="Seleccionar" style="height:44px;border:1px solid #0B6E8A;background:#E3F1F5;border-radius:6px;font-size:11px">Elegir</button>
      <button aria-label="Línea" style="height:44px;border:1px solid #C3CDD6;background:#fff;border-radius:6px;font-size:11px">Línea</button>
      <button aria-label="Polilínea" style="height:44px;border:1px solid #C3CDD6;background:#fff;border-radius:6px;font-size:11px">Polilín.</button>
      <button aria-label="Medir" style="height:44px;border:1px solid #C3CDD6;background:#fff;border-radius:6px;font-size:11px">Medir</button>
      <button aria-label="Fijar longitud" style="height:44px;border:1px solid #C3CDD6;background:#fff;border-radius:6px;font-size:11px">Fijar long.</button>
      <button aria-label="Triangulación" style="height:44px;border:1px solid #C3CDD6;background:#fff;border-radius:6px;font-size:11px">Triang.</button>
      <button aria-label="Base y offset" style="height:44px;border:1px solid #C3CDD6;background:#fff;border-radius:6px;font-size:11px">Base+off.</button>
      <button aria-label="Símbolo" style="height:44px;border:1px solid #C3CDD6;background:#fff;border-radius:6px;font-size:11px">Símbolo</button>
    </div>
    <div style="flex-grow:1;position:relative;background:#fff;min-width:0">
      <svg viewBox="0 0 760 600" width="100%" height="100%" role="img" aria-label="Plano de una intersección con dos vías, un vehículo y tres indicios numerados">
        <rect x="0" y="0" width="760" height="600" fill="#FBFCFD"/>
        <g opacity=".35"><polyline points="60,300 700,310" stroke="#7C8B99" stroke-width="2" fill="none" stroke-dasharray="4 4"/></g>
        <polyline points="40,250 330,250 330,40" fill="none" stroke="#14202B" stroke-width="3"/>
        <polyline points="40,370 330,370 330,560" fill="none" stroke="#14202B" stroke-width="3"/>
        <polyline points="430,40 430,250 720,250" fill="none" stroke="#14202B" stroke-width="3"/>
        <polyline points="430,560 430,370 720,370" fill="none" stroke="#14202B" stroke-width="3"/>
        <rect x="440" y="262" width="70" height="30" rx="4" fill="#E3F1F5" stroke="#0B6E8A" stroke-width="2"/>
        <g fill="#B3261E" stroke="#fff" stroke-width="2"><circle cx="360" cy="320" r="11"/><circle cx="400" cy="345" r="11"/><circle cx="300" cy="300" r="11"/></g>
        <g font-size="12" fill="#fff" font-weight="700" text-anchor="middle"><text x="360" y="324">1</text><text x="400" y="349">2</text><text x="300" y="304">3</text></g>
        <g stroke="#0B6E8A" stroke-width="1.5" fill="none"><line x1="330" y1="420" x2="430" y2="420"/><line x1="330" y1="412" x2="330" y2="428"/><line x1="430" y1="412" x2="430" y2="428"/></g>
        <text x="380" y="438" font-size="13" fill="#0B6E8A" text-anchor="middle" font-weight="700">8,40 m</text>
        <g stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4" fill="none"><line x1="330" y1="370" x2="360" y2="320"/><line x1="430" y1="370" x2="360" y2="320"/></g>
        <text x="332" y="338" font-size="12" fill="#B45309">5,10 m</text>
        <text x="402" y="338" font-size="12" fill="#B45309">4,20 m</text>
        <g transform="translate(700,60)"><circle r="18" fill="none" stroke="#14202B" stroke-width="2"/><polygon points="0,-14 6,6 0,2 -6,6" fill="#14202B"/><text y="-24" font-size="12" text-anchor="middle" font-weight="700">N</text></g>
      </svg>
      <div style="position:absolute;left:12px;bottom:12px;background:#14202Bd9;color:#fff;font-size:12px;padding:6px 10px;border-radius:6px">x 4,52 m · y 3,10 m · fuente 40 %</div>
    </div>
    <div style="width:300px;background:#fff;border-left:1px solid #D5DCE3;padding:16px;display:flex;flex-direction:column;gap:14px;font-size:13px">
      <b style="font-size:15px">Triangulación</b>
      <label style="display:flex;flex-direction:column;gap:4px">Referencia A<select style="height:36px;border:1px solid #9AA8B5;border-radius:6px;padding:0 8px"><option>Esquina SO</option></select></label>
      <label style="display:flex;flex-direction:column;gap:4px">Distancia a A (m)<input value="5,10" style="height:36px;border:1px solid #9AA8B5;border-radius:6px;padding:0 10px"></label>
      <label style="display:flex;flex-direction:column;gap:4px">Referencia B<select style="height:36px;border:1px solid #9AA8B5;border-radius:6px;padding:0 8px"><option>Esquina SE</option></select></label>
      <label style="display:flex;flex-direction:column;gap:4px">Distancia a B (m)<input value="4,20" style="height:36px;border:1px solid #9AA8B5;border-radius:6px;padding:0 10px"></label>
      <div style="background:#F4F6F8;border-radius:6px;padding:10px;line-height:1.5">Dos soluciones. Se preselecciona la más cercana a lo dibujado.</div>
      <button style="height:40px;background:#0B6E8A;color:#fff;border:0;border-radius:6px;font-size:14px;font-weight:600">Confirmar indicio 1</button>
      <b style="font-size:15px;margin-top:6px">Sugerencias</b>
      <div style="display:flex;justify-content:space-between"><span>12 polilíneas</span><span style="color:#7A3E00">3 baja confianza</span></div>
      <div style="display:flex;gap:8px"><button style="flex:1;height:36px;border:1px solid #7C8B99;background:#fff;border-radius:6px">Rechazar</button><button style="flex:1;height:36px;border:1px solid #0B6E8A;background:#E3F1F5;border-radius:6px">Aceptar lote</button></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
